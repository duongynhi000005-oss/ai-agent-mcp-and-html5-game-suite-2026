<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Neon Cyber Survivor 2026 — Bullet Heaven HTML5</title>
<style>
  * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
  body { background: #030712; color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
  canvas { background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); border: 2px solid #38bdf8; border-radius: 12px; box-shadow: 0 0 40px rgba(56,189,248,0.25); }
  #hud { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 18px; background: rgba(15,23,42,0.88); border: 1px solid #38bdf8; padding: 8px 20px; border-radius: 999px; font-weight: 700; font-size: 14px; z-index: 10; }
  #upgradeModal { position: fixed; inset: 0; background: rgba(2,6,23,0.85); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 20; }
  .card-row { display: flex; gap: 14px; margin-top: 16px; }
  .up-card { background: #1e293b; border: 2px solid #38bdf8; border-radius: 12px; padding: 18px; width: 210px; text-align: center; cursor: pointer; transition: transform 0.15s; }
  .up-card:hover { transform: translateY(-5px); border-color: #f59e0b; }
</style>
</head>
<body>
  <div id="hud">
    <span>❤️ HP: <b id="hpTxt" style="color:#4ade80">100</b></span>
    <span>⚡ LVL: <b id="lvlTxt" style="color:#38bdf8">1</b></span>
    <span>💎 XP: <b id="xpTxt" style="color:#fbbf24">0 / 10</b></span>
    <span>🏆 SCORE: <b id="scoreTxt" style="color:#f472b6">0</b></span>
    <span>🪙 COINS: <b id="coinTxt" style="color:#fde047">0</b></span>
  </div>
  <div id="upgradeModal">
    <h2 style="color:#38bdf8;font-size:28px;">⚡ LEVEL UP! CHOOSE CYBER UPGRADE</h2>
    <div class="card-row" id="cardRow"></div>
    <button id="btn2xAd" style="margin-top:18px;padding:10px 22px;border-radius:99px;background:linear-gradient(135deg,#f59e0b,#d97706);border:none;font-weight:800;cursor:pointer;color:#000;">
      📺 Watch Sponsored Ad (+50 Bonus Coins &amp; Full Heal)
    </button>
  </div>
  <canvas id="gameCanvas" width="960" height="600"></canvas>
<script>
// GameMonetize / CrazyGames SDK Hook (Auto-Safe Fallback when running on Itch.io or standalone)
window.SDK_OPTIONS = {
  gameId: "neon_cyber_survivor_2026",
  onEvent: function (a) {
    if (a.name === "SDK_GAME_PAUSE") window.__GAME_PAUSED = true;
    if (a.name === "SDK_GAME_START") window.__GAME_PAUSED = false;
  }
};
function triggerRewardedAd(cb) {
  if (typeof sdk !== 'undefined' && sdk.showBanner) {
    try { sdk.showBanner(); } catch (_) {}
  }
  cb();
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

const savedCoins = Number(localStorage.getItem('ncs_coins_2026') || '0');
const player = { x: 480, y: 300, r: 14, speed: 3.6, hp: 100, maxHp: 100, fireRate: 22, fireCd: 0, dmg: 18, multiShot: 1, magnet: 110, lvl: 1, xp: 0, nextXp: 10, score: 0, coins: savedCoins };
const bullets = [];
const enemies = [];
const gems = [];
let frame = 0;

const UPGRADES = [
  { title: '🔥 Twin Plasma Cannon', desc: '+1 Projectile per shot', apply: () => player.multiShot++ },
  { title: '⚡ Overclocked Fire Rate', desc: '+25% Faster Auto-Fire', apply: () => player.fireRate = Math.max(6, Math.floor(player.fireRate * 0.78)) },
  { title: '💥 High-Voltage Rounds', desc: '+12 Bullet Damage', apply: () => player.dmg += 12 },
  { title: '🧲 Cyber Magnet Core', desc: '+60 XP Gem Pickup Radius', apply: () => player.magnet += 60 },
  { title: '🛡️ Nano Repair & Thrusters', desc: 'Heal +40 HP & +15% Move Speed', apply: () => { player.hp = Math.min(player.maxHp, player.hp + 40); player.speed *= 1.15; } }
];

function openUpgradeModal() {
  window.__GAME_PAUSED = true;
  const modal = document.getElementById('upgradeModal');
  const row = document.getElementById('cardRow');
  row.innerHTML = '';
  const picks = [...UPGRADES].sort(() => Math.random() - 0.5).slice(0, 3);
  picks.forEach(u => {
    const d = document.createElement('div');
    d.className = 'up-card';
    d.innerHTML = `<h3 style="color:#fde047;margin-bottom:8px;">${u.title}</h3><p style="font-size:13px;color:#cbd5e1;">${u.desc}</p>`;
    d.onclick = () => {
      u.apply();
      modal.style.display = 'none';
      window.__GAME_PAUSED = false;
    };
    row.appendChild(d);
  });
  modal.style.display = 'flex';
}

document.getElementById('btn2xAd').onclick = () => {
  triggerRewardedAd(() => {
    player.coins += 50;
    player.hp = player.maxHp;
    localStorage.setItem('ncs_coins_2026', String(player.coins));
    document.getElementById('upgradeModal').style.display = 'none';
    window.__GAME_PAUSED = false;
  });
};

function spawnEnemy() {
  const edge = Math.floor(Math.random() * 4);
  let x = 0, y = 0;
  if (edge === 0) { x = Math.random() * canvas.width; y = -20; }
  else if (edge === 1) { x = canvas.width + 20; y = Math.random() * canvas.height; }
  else if (edge === 2) { x = Math.random() * canvas.width; y = canvas.height + 20; }
  else { x = -20; y = Math.random() * canvas.height; }
  const tier = 1 + Math.floor(frame / 1200);
  enemies.push({ x, y, r: 12 + (tier % 3) * 3, hp: 20 + tier * 14, maxHp: 20 + tier * 14, speed: 1.2 + Math.min(1.8, tier * 0.12), color: tier % 2 === 0 ? '#f43f5e' : '#a855f7' });
}

function update() {
  if (window.__GAME_PAUSED) return;
  frame++;
  if (keys['w'] || keys['arrowup']) player.y = Math.max(player.r, player.y - player.speed);
  if (keys['s'] || keys['arrowdown']) player.y = Math.min(canvas.height - player.r, player.y + player.speed);
  if (keys['a'] || keys['arrowleft']) player.x = Math.max(player.r, player.x - player.speed);
  if (keys['d'] || keys['arrowright']) player.x = Math.min(canvas.width - player.r, player.x + player.speed);

  if (frame % Math.max(15, 55 - player.lvl * 3) === 0) spawnEnemy();

  // Auto-aim at nearest enemy
  if (player.fireCd > 0) player.fireCd--;
  if (player.fireCd <= 0 && enemies.length > 0) {
    let nearest = enemies[0], bestD = 1e9;
    for (const e of enemies) {
      const d = Math.hypot(e.x - player.x, e.y - player.y);
      if (d < bestD) { bestD = d; nearest = e; }
    }
    const baseAngle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
    for (let i = 0; i < player.multiShot; i++) {
      const spread = (i - (player.multiShot - 1) / 2) * 0.14;
      bullets.push({ x: player.x, y: player.y, vx: Math.cos(baseAngle + spread) * 8.5, vy: Math.sin(baseAngle + spread) * 8.5, r: 4 });
    }
    player.fireCd = player.fireRate;
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy;
    if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) { bullets.splice(i, 1); continue; }
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (Math.hypot(b.x - e.x, b.y - e.y) < b.r + e.r) {
        e.hp -= player.dmg;
        bullets.splice(i, 1);
        if (e.hp <= 0) {
          gems.push({ x: e.x, y: e.y, r: 5 });
          enemies.splice(j, 1);
          player.score += 10;
          player.coins += 1;
          localStorage.setItem('ncs_coins_2026', String(player.coins));
        }
        break;
      }
    }
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const ang = Math.atan2(player.y - e.y, player.x - e.x);
    e.x += Math.cos(ang) * e.speed;
    e.y += Math.sin(ang) * e.speed;
    if (Math.hypot(player.x - e.x, player.y - e.y) < player.r + e.r) {
      player.hp -= 0.45;
      if (player.hp <= 0) {
        player.hp = player.maxHp;
        enemies.length = 0;
        player.score = Math.floor(player.score * 0.8);
      }
    }
  }

  for (let i = gems.length - 1; i >= 0; i--) {
    const g = gems[i];
    const d = Math.hypot(player.x - g.x, player.y - g.y);
    if (d < player.magnet) {
      g.x += (player.x - g.x) * 0.18;
      g.y += (player.y - g.y) * 0.18;
    }
    if (d < player.r + g.r + 4) {
      gems.splice(i, 1);
      player.xp++;
      if (player.xp >= player.nextXp) {
        player.xp -= player.nextXp;
        player.lvl++;
        player.nextXp = Math.floor(player.nextXp * 1.45);
        openUpgradeModal();
      }
    }
  }

  document.getElementById('hpTxt').textContent = Math.ceil(player.hp);
  document.getElementById('lvlTxt').textContent = player.lvl;
  document.getElementById('xpTxt').textContent = `${player.xp} / ${player.nextXp}`;
  document.getElementById('scoreTxt').textContent = player.score;
  document.getElementById('coinTxt').textContent = player.coins;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // Subtle cyber grid
  ctx.strokeStyle = 'rgba(56,189,248,0.06)';
  for (let x = 0; x < canvas.width; x += 48) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
  for (let y = 0; y < canvas.height; y += 48) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

  for (const g of gems) {
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2); ctx.fill();
  }
  for (const b of bullets) {
    ctx.fillStyle = '#fde047';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
  }
  for (const e of enemies) {
    ctx.fillStyle = e.color;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = '#22d3ee';
  ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
